<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#151210" />
    <!-- apply the saved day/night choice before first paint (key: src/appearance/context.ts) -->
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('sm.portfolio.theme') === 'day' ? 'day' : 'night'
      } catch (e) {
        document.documentElement.dataset.theme = 'night'
      }
    </script>
    <!-- title and description are replaced at runtime by the active language -->
    <title>Santiago Monedero — Full-stack developer, web and mobile</title>
    <meta
      name="description"
      content="Full-stack development with React, TypeScript, NestJS, PostgreSQL and Prisma, plus React Native apps for iOS, Android and Android TV. Freelance, based in Buenos Aires."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
